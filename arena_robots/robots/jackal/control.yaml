controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jackal_velocity_controller:
      type: diff_drive_controller/DiffDriveController

jackal_velocity_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names: [ "front_left_wheel_joint", "rear_left_wheel_joint" ]
    right_wheel_names: [ "front_right_wheel_joint", "rear_right_wheel_joint" ]

    wheel_separation: 0.37559
    wheel_radius: 0.098

    # 4-wheel skid steer scrubs during rotation, so the effective lever arm is
    # wider than the physical track; 1.5 is empirical.
    wheel_separation_multiplier: 1.5

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.03, 1000000.0, 1000000.0, 0.03]

    open_loop: false
    enable_odom_tf: false

    # Must exceed the slowest planner's control period or the base halts between
    # commands and the robot stutters. SICNav at a 5-human crowd solves at ~2 Hz
    # (~0.5 s) and the bridge publishes one cmd_vel per solve, so at the stock
    # 0.25 s the controller timed out and zeroed velocity for ~half of every cycle
    # -> ground speed collapsed to ~0.14 m/s (commanded 0.32) and the lagging odom
    # fed back into the MPC's acceleration limit, pinning the command low. 1.0 s
    # comfortably covers the 0.8 s bridge action timeout; benign for fast planners
    # (commands arrive every <0.1 s, so it never triggers in normal operation).
    cmd_vel_timeout: 1.0
    use_stamped_vel: true

    publish_cmd: true
    publish_wheel_data: true

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 20.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 4.0
    angular.z.max_acceleration: 25.0
